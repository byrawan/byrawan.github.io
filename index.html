  var params = {}, parameters = {};
  new URLSearchParams(location.search).forEach(function (v, k) {
    if (!(k in params)) params[k] = v;
    (parameters[k] = parameters[k] || []).push(v);
  });
  window.google = { script: {
    run: runner(null, null, undefined),
    url: { getLocation: function (cb) { cb({ parameter: params, parameters: parameters, hash: location.hash.replace(/^#/, "") }); } },
    host: { close: function () {}, setHeight: function () {}, setWidth: function () {} }
  } };
} + ")(" + JSON.stringify(EXEC) + ");";

if (Q.has("unsub") || Q.has("page")) {

    })
