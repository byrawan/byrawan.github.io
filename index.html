<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rawan Courses</title>
<meta name="description" content="شهادات معتمدة، وتطبيق عملي، وتجربة تدريبية تليق بك.">
<meta name="theme-color" content="#e9efe5">
<style>
  html,body{margin:0;height:100%;background:#faf7f2}
  iframe{border:0;width:100%;height:100%;display:block}
  .ld{font-family:Tahoma,Arial,sans-serif;color:#5f6b62;text-align:center;padding-top:40vh;font-size:15px}
</style>
</head>
<body>
<p class="ld">جارٍ فتح نموذج التسجيل…</p>
<script>
/*
  الموقع يجيب الفورم من Apps Script ويعرضه هنا مباشرة، ويكلّم السيرفر بـ fetch بدون حسابات قوقل.
  كذا ما يتأثر إذا المتصفح مسجّل فيه أكثر من حساب قوقل.
  روابط إيقاف العروض وصفحة التقييم تفتح بالطريقة القديمة.
*/
var EXEC = "https://script.google.com/macros/s/AKfycbxvUBpwEXMsv_tICeW17V7eL4NaSgJjUkC87Sd3NTBoM7yO_fd3oukm_hDV0dsPBdRKzQ/exec";
var Q = new URLSearchParams(location.search);

function legacy() {
  document.body.innerHTML = '<iframe title="Rawan Courses" allow="clipboard-write" src="' + EXEC + location.search + '"></iframe>';
}

// بديل google.script.run و google.script.url داخل الفورم
var SHIM = "(" + function (EXEC) {
  function runner(ok, fail, user) {
    return new Proxy({}, {
      get: function (_, name) {
        if (name === "withSuccessHandler") return function (h) { return runner(h, fail, user); };
        if (name === "withFailureHandler") return function (h) { return runner(ok, h, user); };
        if (name === "withUserObject") return function (o) { return runner(ok, fail, o); };
        return function () {
          var args = Array.prototype.slice.call(arguments);
          fetch(EXEC, {
            method: "POST", credentials: "omit",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ fn: name, args: args })
          }).then(function (r) { return r.json(); }).then(function (j) {
            if (j && j.ok) { if (ok) ok(j.result, user); }
            else if (fail) fail(new Error((j && j.error) || "error"), user);
          }).catch(function (e) { if (fail) fail(e, user); });
        };
      }
    });
  }
  var params = {}, parameters = {};
  new URLSearchParams(location.search).forEach(function (v, k) {
    if (!(k in params)) params[k] = v;
    (parameters[k] = parameters[k] || []).push(v);
  });
  window.google = { script: {
    run: runner(null, null, undefined),
    url: { getLocation: function (cb) { cb({ parameter: params, parameters: parameters, hash: location.hash.replace(/^#/, "") }); } },
    host: { close: function () {}, setHeight: function () {}, setWidth: function () {} }
  } };
} + ")(" + JSON.stringify(EXEC) + ");";

if (Q.has("unsub") || Q.has("page")) {
  legacy();
} else {
  fetch(EXEC + "?raw=1", { credentials: "omit" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      if (html.indexOf("google.script") < 0) throw new Error("bad page");
      document.open();
      document.write('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script>' + SHIM + '<\/script>' + html);
      document.close();
    })
    .catch(legacy);
}
</script>
</body>
</html>
